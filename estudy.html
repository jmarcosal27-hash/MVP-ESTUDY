<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estudy – Organização dos Estudos</title>
  <style>
:root {
  --bg: #f4f6fa; --surface: #fff; --text: #1d2433; --muted: #6a7389; --line: #dfe3ec; --accent: #3b5bdb;
  --blue: #1971c2; --blue-bg: #d0ebff; --red: #c92a2a; --red-bg: #ffe3e3; --green: #2b8a3e; --green-bg: #d3f9d8;
  --warn: #e67700; --hour: 52px;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #14171f; --surface: #1d222d; --text: #e6e9f0; --muted: #98a1b6; --line: #333a4a; --accent: #748ffc;
    --blue: #74c0fc; --blue-bg: #1c3550; --red: #ffa8a8; --red-bg: #4a2327; --green: #8ce99a; --green-bg: #1f4128; --warn: #ffc078; }
}
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--text); }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
button.danger { color: var(--red); }
input, select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar h1 { font-size: 18px; margin: 0; }
.tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
main { padding: 12px 16px 220px; }
.muted { color: var(--muted); font-size: 12px; }
.cal-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.cal-nav { display: flex; align-items: center; gap: 6px; }
.cal-nav h2 { font-size: 16px; margin: 0 8px; }
.summary { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.stat b { display: block; font-size: 15px; }
.legend { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.chip { border-radius: 10px; padding: 1px 8px; font-size: 12px; font-weight: 600; }
.st-em_dia { background: var(--blue-bg); color: var(--blue); }
.st-atrasado { background: var(--red-bg); color: var(--red); }
.st-concluido { background: var(--green-bg); color: var(--green); }

.calendar { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.cal-grid { display: grid; grid-template-columns: 48px repeat(7, minmax(120px, 1fr)); min-width: 900px; }
.cal-head { position: sticky; top: 0; z-index: 3; background: var(--surface); border-bottom: 1px solid var(--line); padding: 6px; font-size: 12px; }
.cal-head.today { background: var(--blue-bg); }
.cal-head .dname { font-weight: 700; font-size: 13px; }
.cal-head .totals { color: var(--muted); }
.gutter { position: relative; }
.gutter span { position: absolute; right: 6px; font-size: 11px; color: var(--muted); transform: translateY(-50%); }
.col { position: relative; border-left: 1px solid var(--line); cursor: cell;
  background-image: linear-gradient(var(--line) 1px, transparent 1px); background-size: 100% var(--hour); }
.col.today { background-color: color-mix(in srgb, var(--blue-bg) 35%, transparent); }
.col.dragover { outline: 2px dashed var(--accent); outline-offset: -2px; }
.now-line { position: absolute; left: 0; right: 0; height: 2px; background: var(--red); z-index: 2; pointer-events: none; }
.block { position: absolute; left: 3px; right: 3px; border-radius: 6px; padding: 3px 6px; overflow: hidden; cursor: pointer;
  border-left: 5px solid; font-size: 12px; z-index: 1; box-shadow: 0 1px 2px rgba(0,0,0,.15); }
.block.st-em_dia { background: var(--blue-bg); border-color: var(--blue); color: var(--text); }
.block.st-atrasado { background: var(--red-bg); border-color: var(--red); color: var(--text); }
.block.st-concluido { background: var(--green-bg); border-color: var(--green); color: var(--text); }
.block.conflict { outline: 2px solid var(--warn); }
.block.active { box-shadow: 0 0 0 2px var(--accent); }
.block b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.block .meta { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.tag { font-weight: 700; font-size: 11px; }
.tag.run { color: var(--accent); }
.tag.warn { color: var(--warn); }

.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; margin-bottom: 12px; }
.filters label { display: grid; gap: 2px; font-size: 12px; color: var(--muted); }
table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th:first-child, td:first-child, td.l, th.l { text-align: left; }
.table-wrap { overflow-x: auto; margin-bottom: 14px; }
tr.total td { font-weight: 700; background: var(--bg); }
tr.sub td { background: var(--bg); font-size: 13px; }
details.rep-blocks summary { cursor: pointer; color: var(--accent); }

dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--text); padding: 16px; width: min(640px, 94vw); max-height: 92vh; overflow: auto; }
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog h3 { margin-top: 0; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.form-grid label, .field { display: grid; gap: 2px; font-size: 12px; color: var(--muted); }
.form-grid .wide { grid-column: 1 / -1; }
fieldset { border: 1px solid var(--line); border-radius: 8px; margin: 12px 0; padding: 10px; }
legend { font-size: 12px; color: var(--muted); padding: 0 4px; }
.preview { background: var(--bg); border-radius: 8px; padding: 8px 10px; margin-top: 10px; }
.errors { color: var(--red); background: var(--red-bg); border-radius: 6px; padding: 6px 10px; margin: 8px 0; }
.errors:empty { display: none; }
.actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 14px; }
.actions .left { margin-right: auto; display: flex; gap: 8px; flex-wrap: wrap; }

.timer { position: fixed; right: 12px; bottom: 12px; width: min(380px, calc(100vw - 24px)); background: var(--surface); border: 2px solid var(--accent);
  border-radius: 12px; padding: 12px 14px; box-shadow: 0 6px 24px rgba(0,0,0,.25); z-index: 10; }
.timer.rest { border-color: var(--green); }
.timer.extra { border-color: var(--warn); }
.timer .phase { font-weight: 700; text-transform: uppercase; font-size: 12px; letter-spacing: .05em; }
.timer .clock { font-size: 44px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.timer .row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.timer .info { font-size: 12px; color: var(--muted); display: grid; gap: 1px; margin-top: 6px; }
.alert-banner { background: var(--warn); color: #000; padding: 10px 16px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.alert-banner[hidden] { display: none; }

.stat.bad { border-color: var(--red); background: var(--red-bg); }
.cap-warn { flex-basis: 100%; background: var(--red-bg); color: var(--red); border-radius: 8px; padding: 6px 10px; font-weight: 600; }
.form-grid label.check { display: flex; gap: 6px; align-items: center; color: var(--text); }
.form-grid label.check input { width: auto; }

.chat-drawer { position: fixed; right: 12px; top: 64px; bottom: 12px; width: min(380px, calc(100vw - 24px)); z-index: 9; background: var(--surface);
  border: 1px solid var(--line); border-radius: 12px; padding: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.2); display: flex; flex-direction: column; }
.chat-drawer[hidden] { display: none; }
body.has-timer .chat-drawer { bottom: 270px; }
@media (min-width: 1100px) { body.chat-open main { margin-right: 404px; } }
.chat-drawer.chat { height: auto; }

#dlg-schedule { width: min(860px, 96vw); }
.sched-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 6px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; }
.sched-row label { display: grid; gap: 2px; font-size: 11px; color: var(--muted); }
.sched-row .rm { align-self: end; }
.sched-out table td, .sched-out table th { padding: 4px 6px; }
.sched-out input[type=date], .sched-out input[type=time] { width: auto; }
.unplaced { background: var(--red-bg); color: var(--red); border-radius: 8px; padding: 6px 10px; margin: 6px 0; }

</style>
  <style>
/* Painel do chat. Usa as variáveis de cor do app (com valores de reserva) e só estiliza .chat. */
.chat { display: flex; flex-direction: column; gap: 8px; min-height: 0; height: 100%; font-size: 14px; color: var(--text, #1d2433); }
.chat-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.chat-head button { font-size: 12px; padding: 3px 8px; }
.chat-head button:disabled { opacity: .5; cursor: default; }
.chat-banner { background: var(--red-bg, #ffe3e3); color: var(--red, #c92a2a); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
.chat-banner[hidden] { display: none; }
.chat-list { flex: 1; min-height: 120px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding: 4px 2px; }
.chat-msg { max-width: 92%; padding: 6px 10px; border-radius: 10px; line-height: 1.4; overflow-wrap: anywhere; }
.chat-user { align-self: flex-end; background: var(--accent, #3b5bdb); color: #fff; }
.chat-assistant { align-self: flex-start; background: var(--surface, #fff); border: 1px solid var(--line, #dfe3ec); }
.chat-system { align-self: flex-start; background: var(--bg, #f4f6fa); border: 1px dashed var(--line, #dfe3ec); color: var(--muted, #6a7389); font-size: 13px; }
.chat-card { align-self: stretch; background: var(--surface, #fff); border: 1px solid var(--accent, #3b5bdb); border-radius: 10px; padding: 8px 10px; }
.chat-card.done { opacity: .6; border-color: var(--line, #dfe3ec); }
.chat-card p { margin: 6px 0; }
.chat-card-title { font-weight: 700; font-size: 13px; margin-bottom: 4px; }
.chat-card ul { margin: 4px 0; padding-left: 18px; }
.chat-warn { color: var(--warn, #e67700); }
.chat-conf { color: var(--red, #c92a2a); }
.chat-cap, .chat-info { color: var(--muted, #6a7389); font-size: 12px; }
.chat-day { font-size: 13px; margin: 2px 0; }
.chat-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.chat-actions button:disabled { opacity: .5; cursor: default; }
.chat-form { display: flex; gap: 6px; align-items: flex-end; }
.chat-input { flex: 1; resize: vertical; min-height: 40px; max-height: 140px; }
.chat-form button { align-self: stretch; }

</style>
</head>
<body>
  <header class="topbar">
    <h1>📚 Estudy</h1>
    <nav>
      <button data-view="calendar" class="tab active">Calendário</button>
      <button data-view="reports" class="tab">Relatórios</button>
      <button data-view="weekly" class="tab" id="tab-weekly">Relatório semanal</button>
      <button id="btn-chat" class="tab">💬 Assistente</button>
      <button id="btn-settings" class="tab">⚙ Pomodoro padrão</button>
    </nav>
  </header>

  <div id="alert-banner" class="alert-banner" hidden role="alert"></div>

  <main>
    <section id="view-calendar">
      <div class="cal-toolbar">
        <div class="cal-nav">
          <button id="prev-week" aria-label="Semana anterior">‹</button>
          <button id="today-week">Hoje</button>
          <button id="next-week" aria-label="Próxima semana">›</button>
          <h2 id="week-title"></h2>
        </div>
        <div class="cal-nav"><button id="gen-schedule">🗓 Gerar cronograma</button><button id="week-config">⚙ Semana: limite e disponibilidade</button><button id="new-block" class="primary">+ Novo bloco</button></div>
      </div>
      <div id="capacity" class="summary capacity"></div>
      <div id="week-summary" class="summary"></div>
      <div class="legend">
        <span class="chip st-em_dia">Em dia</span><span class="chip st-atrasado">Atrasado</span><span class="chip st-concluido">Concluído</span>
        <span class="muted">Clique em um horário vazio para criar · arraste um bloco para reagendar</span>
      </div>
      <div id="calendar" class="calendar"></div>
    </section>

    <section id="view-weekly" hidden>
      <div class="filters"><label>Semana <select id="w-week"></select></label><button type="button" id="w-refresh">Atualizar relatório</button>
        <span class="muted" id="w-meta"></span></div>
      <div id="weekly"></div>
    </section>

    <section id="view-reports" hidden>
      <form id="report-filters" class="filters">
        <label>Matéria <select id="f-subject"></select></label>
        <label>De <input type="date" id="f-from"></label>
        <label>Até <input type="date" id="f-to"></label>
        <label>Agrupar por
          <select id="f-group"><option value="subject">Matéria</option><option value="week">Semana</option></select>
        </label>
        <button type="button" id="f-clear">Limpar</button>
      </form>
      <div id="report"></div>
    </section>
  </main>

  <aside id="chat-drawer" class="chat-drawer" hidden></aside>
  <aside id="timer" class="timer" hidden></aside>

  <dialog id="dlg-block"></dialog>
  <dialog id="dlg-settings"></dialog>
  <dialog id="dlg-week"></dialog>
  <dialog id="dlg-schedule"></dialog>

  <script>
/* Regras de negócio do MVP-ESTUDY (sem acesso a DOM ou storage, para ser testável em Node). */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.Core = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  const MIN = 60000;
  const DEFAULT_CONFIG = { focusMin: 25, shortMin: 5, longEvery: 4, longMin: 15 };

  /* ---------- datas e horas ---------- */
  const pad = (n) => String(n).padStart(2, '0');
  const isoDate = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parseDate = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const toMin = (hhmm) => { const [h, m] = hhmm.split(':').map(Number); return h * 60 + m; };
  const fromMin = (min) => `${pad(Math.floor(min / 60))}:${pad(min % 60)}`;
  const addDays = (d, n) => { const r = new Date(d); r.setDate(r.getDate() + n); return r; };
  function mondayOf(d) {
    const r = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    r.setDate(r.getDate() - ((r.getDay() + 6) % 7));
    return r;
  }
  /** Data/hora local a partir de 'YYYY-MM-DD' + minutos desde 00:00 (aceita 1440 = meia-noite seguinte). */
  const atMinutes = (dateStr, min) => { const d = parseDate(dateStr); d.setMinutes(min); return d; };

  function fmtDur(ms) {
    const totalMin = Math.round(ms / MIN);
    if (totalMin < 60) return `${totalMin}min`;
    const h = Math.floor(totalMin / 60), m = totalMin % 60;
    return m ? `${h}h ${pad(m)}min` : `${h}h`;
  }
  function fmtClock(ms) {
    const s = Math.max(0, Math.floor(ms / 1000));
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    return h ? `${h}:${pad(m)}:${pad(sec)}` : `${pad(m)}:${pad(sec)}`;
  }

  /* ---------- configuração do pomodoro ---------- */
  function validateConfig(c) {
    const errors = [];
    const chk = (v, label) => { if (!Number.isInteger(v) || v < 1) errors.push(`${label}: informe um número inteiro maior que zero.`); };
    chk(c.focusMin, 'Duração do pomodoro');
    chk(c.shortMin, 'Pausa curta');
    chk(c.longEvery, 'Pomodoros até a pausa longa');
    chk(c.longMin, 'Pausa longa');
    return errors;
  }

  /* ---------- planejamento por pomodoros ---------- */
  /** Pausa após o pomodoro i (1-based): longa a cada `longEvery`, curta nos demais; nenhuma após o último. */
  function breaksFor(estimated, cfg) {
    const out = [];
    for (let i = 1; i < estimated; i++) out.push(i % cfg.longEvery === 0 ? 'long' : 'short');
    return out;
  }
  function planBlock(estimated, cfg) {
    const breaks = breaksFor(estimated, cfg);
    const studyMin = estimated * cfg.focusMin;
    const restMin = breaks.reduce((s, b) => s + (b === 'long' ? cfg.longMin : cfg.shortMin), 0);
    return { studyMin, restMin, totalMin: studyMin + restMin, breaks };
  }
  function blockSpan(block) {
    const p = planBlock(block.estimated, block.config);
    const startMin = toMin(block.start);
    return { ...p, startMin, endMin: startMin + p.totalMin };
  }
  /** Horário de início + duração total; avisa quando passa da meia-noite. */
  function validateBlockPlan(b) {
    const errors = [];
    if (!b.subject || !b.subject.trim()) errors.push('Informe a matéria.');
    if (!b.title || !b.title.trim()) errors.push('Informe o assunto ou título.');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(b.date || '')) errors.push('Informe o dia do estudo.');
    if (!/^\d{2}:\d{2}$/.test(b.start || '')) errors.push('Informe o horário de início.');
    if (!Number.isInteger(b.estimated) || b.estimated < 1) errors.push('A estimativa deve ser um número inteiro de pomodoros (mínimo 1).');
    errors.push(...validateConfig(b.config));
    if (!errors.length && blockSpan(b).endMin > 1440) errors.push('O bloco ultrapassa a meia-noite; ajuste o horário ou a quantidade de pomodoros.');
    return errors;
  }

  /* ---------- situação do bloco ---------- */
  function blockStatus(block, now) {
    if (block.completed) return 'concluido';
    const end = atMinutes(block.date, blockSpan(block).endMin);
    return now.getTime() > end.getTime() ? 'atrasado' : 'em_dia';
  }
  const STATUS_LABEL = { concluido: 'Concluído', atrasado: 'Atrasado', em_dia: 'Em dia' };

  /* ---------- resultados (questões e acertos) ---------- */
  /** Converte entrada de formulário: vazio => null (não preenchido); 0 é um valor válido. */
  function parseCount(raw) {
    if (raw === null || raw === undefined || (typeof raw === 'string' && raw.trim() === '')) return { value: null };
    if (typeof raw === 'number') return Number.isInteger(raw) && raw >= 0 ? { value: raw } : { error: true };
    return /^\d+$/.test(raw.trim()) ? { value: Number(raw.trim()) } : { error: true };
  }
  function validateResult(rawQuestions, rawHits) {
    const errors = [];
    const q = parseCount(rawQuestions), h = parseCount(rawHits);
    if (q.error) errors.push('Questões respondidas: use apenas números inteiros não negativos.');
    if (h.error) errors.push('Acertos: use apenas números inteiros não negativos.');
    if (!errors.length) {
      if (h.value !== null && q.value === null) errors.push('Informe as questões respondidas antes dos acertos.');
      else if (h.value !== null && h.value > q.value) errors.push('Os acertos não podem superar as questões respondidas.');
    }
    return { errors, questions: q.value ?? null, hits: h.value ?? null };
  }
  function accuracy(block) {
    const q = block.questions, h = block.hits;
    if (q === null || q === undefined || q === 0) return { kind: 'none', label: 'Sem questões registradas' };
    if (h === null || h === undefined) return { kind: 'pending', label: 'Resultado pendente' };
    const rate = (h * 100) / q;
    return { kind: 'value', rate, errors: q - h, label: `${rate.toFixed(1).replace('.', ',')}%` };
  }

  /* ---------- totais de tempo realizado ---------- */
  const zeroTotals = () => ({ focusMs: 0, extraMs: 0, restMs: 0, interruptMs: 0, studyMs: 0 });
  function totalsOfSegments(segments) {
    const t = zeroTotals();
    for (const s of segments) {
      if (s.type === 'focus') t.focusMs += s.ms;
      else if (s.type === 'extra') t.extraMs += s.ms;
      else if (s.type === 'rest') t.restMs += s.ms;
      else if (s.type === 'interruption') t.interruptMs += s.ms;
    }
    t.studyMs = t.focusMs + t.extraMs;
    return t;
  }
  function addTotals(a, b) {
    return { focusMs: a.focusMs + b.focusMs, extraMs: a.extraMs + b.extraMs, restMs: a.restMs + b.restMs,
      interruptMs: a.interruptMs + b.interruptMs, studyMs: a.studyMs + b.studyMs };
  }
  function sessionsTotals(sessions) {
    return (sessions || []).reduce((acc, s) => addTotals(acc, s.totals), zeroTotals());
  }
  function sessionsPomodoros(sessions) {
    let complete = 0, partial = 0;
    for (const s of sessions || []) { complete += s.completedPomodoros; partial += s.partialCycles; }
    return { complete, partial };
  }

  /* ---------- cronômetro (máquina de estados baseada em timestamps) ----------
   * phase: focus | extra | short | long.  state: running | paused | awaiting.
   * 'awaiting' = pausa terminou e o próximo foco só começa por ação do usuário (nada é contado).
   * O tempo decorrido é sempre derivado de Date.now(), então aba em segundo plano ou reload não alteram a contagem. */
  const isBreak = (p) => p === 'short' || p === 'long';

  function startSession(blockId, cfg, nowMs, id) {
    return {
      id: id || `s${nowMs}`, blockId, cfg: { ...cfg }, startedAt: nowMs,
      phase: 'focus', state: 'running', phaseMs: 0, since: nowMs, pausedSince: null,
      pomo: 1, completed: 0, lastBreakAt: 0, segments: [],
      cycles: [{ n: 1, focusMs: 0, extraMs: 0, complete: false }],
      alert: null, alertSeq: 0, alertAck: 0,
    };
  }
  function elapsed(s, nowMs) { return s.phaseMs + (s.state === 'running' ? Math.max(0, nowMs - s.since) : 0); }
  const phaseDuration = (s) => (s.phase === 'focus' ? s.cfg.focusMin : s.phase === 'short' ? s.cfg.shortMin : s.cfg.longMin) * MIN;

      if (u.netMin > remaining) {
        unplace(u, 'LIMIT', `Não coube no limite semanal: o bloco exige ${fmt(u.netMin)} líquidos de estudo e restam ${fmt(remaining)} de ${fmt(limitMin)}.`);

          else unplace(u, 'FIXED_CONFLICT', `O horário obrigatório de ${dayName(u.fixedDate)} (${u.fixedStart}–${Core.fromMin(s + u.agendaMin)}) não está livre: fora da disponibilidade, indisponível ou ocupado.`);

          return null;

        if (!any) {

        slot = u.deadline ? search((d) => d <= u.deadline) : any;

      (spread[u.subject] = spread[u.subject] || {})[slot.date] = ((spread[u.subject] || {})[slot.date] || 0) + 1;
      const why = u.fixedDate ? 'Horário obrigatório respeitado' : u.tight ? 'Prazo apertado: primeiro horário livre' : 'Horário livre escolhido espalhando a matéria na semana';
      placements.push({
        tempId: `tmp-${u.itemIndex + 1}-${u.unitIndex}`, subject: u.subject, title: u.title,
        date: slot.date, start: Core.fromMin(slot.start), estimated: u.pomodoros, config: { ...cfg },
        kind: u.kind, reviewOf: u.reviewOf, priority: u.priority, deadline: u.deadline, material: u.material,
        fixed: !!u.fixedDate && !!u.fixedStart,
        reason: `${why}: ${dayName(slot.date)} ${Core.fromMin(slot.start)}–${Core.fromMin(slot.start + u.agendaMin)} (agenda ${fmt(u.agendaMin)}, estudo líquido ${fmt(u.netMin)}).`,

    const after = clone(base);
    after.blocks = [...(after.blocks || []), ...placements.map((p) => ({
      id: p.tempId, subject: p.subject, title: p.title, date: p.date, start: p.start, estimated: p.estimated,
      config: p.config, kind: p.kind, reviewOf: p.reviewOf, priority: p.priority, deadline: p.deadline, fixed: p.fixed,
      material: p.material, pdf: p.material, originWeek: weekMonday, remainingMin: null, source: 'scheduler',
      completed: false, questions: null, hits: null, sessions: [],
    }))];
    const afterCap = Cap.capacityFor(after, weekMonday, nowMs);
    for (const w of afterCap.warnings || []) warnings.push({ code: w, text: WARNING_TEXT[w] || w });
    if (unplaced.length) warnings.push({ code: 'UNPLACED', text: `${unplaced.length} bloco(s) não couberam; veja os motivos. Nada foi omitido ou encurtado.` });

    return { placements, unplaced, capacity: { before, after: afterCap }, warnings };
  }

  return { STEP, proposeSchedule, compareUnits };
});

        const text = `${fmtWhen(after.date, after.start)} está ocupado por ${clash.map((b) => `"${b.title}"`).join(', ')}.`;
        ctx.conflicts.push({ blockId: block.id, with: clash.map((b) => b.id), text });
        const slots = slotsFor(ctx, after, { prefDate: after.date, prefStart: after.start, ignoreId: block.id, afterMs: ctx.nowMs, max: 4 })
          .filter((s) => !(s.date === block.date && s.start === block.start)).slice(0, 3); // não sugere onde o bloco já está
        const alts = slots.map((s) => ({ text: `Mover para ${fmtWhen(s.date, s.start)}`,
          commands: [{ type: 'move_block', ref: { id: block.id }, to: { date: s.date, start: s.start } }] }));
        ctx.alternatives.push(...alts);
        ask(ctx, { id: `dest_busy_${i}`, text: `${text} ${alts.length ? 'Escolha um destes horários livres:' : 'Não achei horário livre próximo; diga outro horário.'}`,
          options: alts.map((a) => ({ label: a.text, commands: a.commands })) });
        return;
      }
      if (!inAvailability(ctx, after, block.id)) warn(ctx, 'FORA_DA_DISPONIBILIDADE', `${fmtWhen(after.date, after.start)} está fora da sua disponibilidade (ou numa indisponibilidade).`);
    }
    if (block.fixed && timeChanged) { warn(ctx, 'BLOCO_FIXO', `"${block.title}" tem horário obrigatório.`); ctx.confirm = true; }
    if (block.completed && timeChanged) { warn(ctx, 'BLOCO_CONCLUIDO', `"${block.title}" já está concluído.`); ctx.confirm = true; }
    const summary = `${verb}: ${describe(block)}${timeChanged ? ` → ${fmtWhen(after.date, after.start)}` : ''}${timeChanged && after.estimated !== block.estimated ? ` (${after.estimated} pomodoro(s))` : ''}`;
    commit(ctx, { op: 'update', id: block.id, before: clone(block), after, summary });
    ctx.mutating++;
  }

  /* ---------- manipuladores de comando ---------- */
  function cmdCreate(ctx, i, cmd) {
    const raw = cmd.block || {};
    const cfg = { ...C.DEFAULT_CONFIG, ...((ctx.state.settings && ctx.state.settings.config) || {}), ...(raw.config || {}) };
    const start = raw.start ? normTime(raw.start) : null;
    const missing = [];
    if (!raw.subject || !String(raw.subject).trim()) missing.push('matéria');
    if (!raw.title || !String(raw.title).trim()) missing.push('assunto');
    if (!isDate(raw.date)) missing.push('dia');
    if (!start) missing.push('horário de início');
    if (!Number.isInteger(raw.estimated) || raw.estimated < 1) missing.push('quantidade de pomodoros');
    if (missing.length) { ask(ctx, { id: `missing_${i}`, missing, text: `Para criar o bloco, falta informar: ${missing.join(', ')}.` }); return; }
    const draft = Cap.normalizeBlock({ ...raw, subject: String(raw.subject).trim(), title: String(raw.title).trim(), start, config: cfg,
      id: raw.id || genId(ctx), completed: false, sessions: [], source: 'chat', originWeek: Cap.weekKey(raw.date) });
    const errs = C.validateBlockPlan(draft);
    if (errs.length) { ask(ctx, { id: `invalid_${i}`, text: `Não consigo criar o bloco: ${errs.join(' ')}` }); return; }
    const dup = ctx.work.find((b) => norm(b.subject) === norm(draft.subject) && norm(b.title) === norm(draft.title) && b.date === draft.date && b.start === draft.start);
    if (dup) { note(ctx, 'noop', `"${dup.title}" já existe em ${fmtWhen(dup.date, dup.start)}; não criei de novo.`, { id: dup.id }); return; }
    const clash = overlapsOf(ctx, draft, null);
    if (clash.length) {
      ctx.conflicts.push({ blockId: draft.id, with: clash.map((b) => b.id), text: `${fmtWhen(draft.date, draft.start)} está ocupado por ${clash.map((b) => `"${b.title}"`).join(', ')}.` });
      const alts = slotsFor(ctx, draft, { prefDate: draft.date, prefStart: draft.start, afterMs: ctx.nowMs })
        .map((s) => ({ text: `Criar em ${fmtWhen(s.date, s.start)}`, commands: [{ type: 'create_block', block: { ...raw, date: s.date, start: s.start } }] }));
      ctx.alternatives.push(...alts);
      ask(ctx, { id: `dest_busy_${i}`, text: `${fmtWhen(draft.date, draft.start)} está ocupado por ${clash.map((b) => `"${b.title}"`).join(', ')}. ${alts.length ? 'Escolha um horário livre:' : 'Diga outro horário.'}`,
        options: alts.map((a) => ({ label: a.text, commands: a.commands })) });
      return;
    }
    if (!inAvailability(ctx, draft, null)) warn(ctx, 'FORA_DA_DISPONIBILIDADE', `${fmtWhen(draft.date, draft.start)} está fora da sua disponibilidade.`);
    const fit = Cap.wouldFit(vstate(ctx), draft, Cap.weekKey(draft.date), ctx.nowMs);
    if (!fit.fitsCapacity) {
      warn(ctx, 'LIMITE_EXCEDIDO', `Criar "${draft.title}" ultrapassa o limite semanal em ${C.fmtDur(fit.excessMin * C.MIN)}.`);
      ctx.alternatives.push(...fit.options.map((o) => ({ text: o.text, commands: [], option: o })));
      ctx.confirm = true;
    }
    commit(ctx, { op: 'create', id: draft.id, before: null, after: draft, summary: `Criar: ${describe(draft)}, ${draft.estimated} pomodoro(s)` });
    ctx.mutating++;
  }

  function cmdUpdate(ctx, i, cmd) {
    const b = resolveOne(ctx, i, cmd.ref); if (!b) return;
    const ch = cmd.changes || {}, patch = {};
    for (const k of Object.keys(ch)) {
      if (!UPDATABLE.includes(k)) { warn(ctx, 'CAMPO_IGNORADO', `O campo "${k}" não pode ser alterado pelo chat.`); continue; }
      patch[k] = k === 'config' ? { ...b.config, ...ch[k] } : k === 'start' ? (normTime(ch[k]) || ch[k]) : ch[k];
    }
    modify(ctx, i, b, patch, 'Editar');
  }

  function cmdMove(ctx, i, cmd) {
    const b = resolveOne(ctx, i, cmd.ref); if (!b) return;
    const to = cmd.to || {}, start = to.start ? normTime(to.start) : b.start;
    if ((to.date && !isDate(to.date)) || !start) { ask(ctx, { id: `invalid_${i}`, text: 'Não entendi o novo dia ou horário. Informe, por exemplo, quinta às 9h.' }); return; }
    if (!to.date && !to.start) { ask(ctx, { id: `move_where_${i}`, text: `Para quando devo mover "${b.title}"?` }); return; }
    modify(ctx, i, b, { date: to.date || b.date, start }, 'Mover');
  }

  function cmdDelete(ctx, i, cmd) {
    const b = resolveOne(ctx, i, cmd.ref); if (!b) return;
    const studied = C.sessionsTotals(b.sessions).studyMs;
    if (studied > 0) warn(ctx, 'EXCLUI_ESTUDO_REGISTRADO', `"${b.title}" tem ${C.fmtDur(studied)} de estudo registrado, que será apagado junto.`);
    ctx.confirm = true; // excluir sempre pede confirmação
    commit(ctx, { op: 'delete', id: b.id, before: clone(b), after: null, summary: `Excluir: ${describe(b)}` });
    ctx.mutating++;
  }

  function cmdAddPomodoro(ctx, i, cmd) {
    const b = resolveOne(ctx, i, cmd.ref); if (!b) return;
    const n = cmd.count == null ? 1 : cmd.count;
    if (!Number.isInteger(n) || n < 1) { ask(ctx, { id: `count_${i}`, text: 'Quantos pomodoros devo acrescentar?' }); return; }
    modify(ctx, i, b, { estimated: b.estimated + n }, `Acrescentar ${n} pomodoro(s)`);
  }

  function cmdComplete(ctx, i, cmd, done) {
    const b = resolveOne(ctx, i, cmd.ref); if (!b) return;
    if (!!b.completed === done) { note(ctx, 'noop', `"${b.title}" já está ${done ? 'concluído' : 'em aberto'}.`, { id: b.id }); return; }
    commit(ctx, { op: 'update', id: b.id, before: clone(b), after: { ...b, completed: done },
      summary: `${done ? 'Concluir' : 'Reabrir'}: ${describe(b)}` });
    ctx.mutating++;
  }

  function cmdAddReview(ctx, i, cmd) {
    const o = resolveOne(ctx, i, cmd.ref); if (!o) return;
    const existing = ctx.work.find((b) => b.kind === 'revisao' && b.reviewOf === o.id && !b.completed);
    if (existing) { note(ctx, 'noop', `Já existe uma revisão de "${o.title}" em ${fmtWhen(existing.date, existing.start)}; não dupliquei.`, { id: existing.id }); return; }
    const estimated = Math.max(1, Math.ceil(o.estimated / 2));
    const draftOf = (date, start) => Cap.normalizeBlock({ id: genId(ctx), subject: o.subject, title: `Revisão: ${o.title}`, date, start, estimated,
      config: o.config, kind: 'revisao', reviewOf: o.id, priority: o.priority, deadline: null, completed: false, sessions: [], source: 'chat', originWeek: Cap.weekKey(date) });
    const date = cmd.date, start = cmd.start ? normTime(cmd.start) : null;
    if (!date || !start) {
      const from = date || C.isoDate(C.addDays(C.parseDate(o.date > C.isoDate(new Date(ctx.nowMs)) ? o.date : C.isoDate(new Date(ctx.nowMs))), 1));
      const slots = slotsFor(ctx, draftOf(from, '08:00'), { prefDate: from, prefStart: start || '08:00', days: 7, max: 3, afterMs: ctx.nowMs });
      ask(ctx, { id: `review_when_${i}`, text: `Quando quer revisar "${o.title}"?${slots.length ? ' Horários livres:' : ''}`,
        options: slots.map((s) => ({ label: fmtWhen(s.date, s.start), commands: [{ type: 'add_review', ref: { id: o.id }, date: s.date, start: s.start }] })) });
      return;
    }
    const draft = draftOf(date, start);
    const errs = C.validateBlockPlan(draft);
    if (errs.length) { ask(ctx, { id: `invalid_${i}`, text: `Não consigo criar a revisão: ${errs.join(' ')}` }); return; }
    const clash = overlapsOf(ctx, draft, null);
    if (clash.length) {
      const alts = slotsFor(ctx, draft, { prefDate: date, prefStart: start, afterMs: ctx.nowMs })
        .map((s) => ({ text: `Revisar em ${fmtWhen(s.date, s.start)}`, commands: [{ type: 'add_review', ref: { id: o.id }, date: s.date, start: s.start }] }));
      ctx.alternatives.push(...alts);
      ctx.conflicts.push({ blockId: draft.id, with: clash.map((b) => b.id), text: `${fmtWhen(date, start)} está ocupado.` });
      ask(ctx, { id: `dest_busy_${i}`, text: `${fmtWhen(date, start)} está ocupado. Escolha um horário livre:`, options: alts.map((a) => ({ label: a.text, commands: a.commands })) });
      return;
    }
    commit(ctx, { op: 'create', id: draft.id, before: null, after: draft, summary: `Criar revisão: ${describe(draft)}` });
    ctx.mutating++;
  }

  /* consultas: tudo calculado aqui, nunca pelo LLM */
  const blockView = (b) => { const [s, e] = spanOf(b); return { id: b.id, subject: b.subject, title: b.title, kind: b.kind, start: b.start, end: C.fromMin(e),
    studyMin: Cap.netStudyMin(b), agendaMin: Cap.agendaMin(b), completed: !!b.completed }; };
  function rangeOf(ctx, r, fallbackDays) {
    const today = C.isoDate(new Date(ctx.nowMs));
    r = r || {};
    const from = isDate(r.from) ? r.from : isDate(r.date) ? r.date : today;
    const to = isDate(r.to) ? r.to : isDate(r.from) || isDate(r.date) ? from : C.isoDate(C.addDays(C.parseDate(from), fallbackDays));
    const dates = []; for (let d = from; d <= to && dates.length < 62; d = C.isoDate(C.addDays(C.parseDate(d), 1))) dates.push(d);
    return { from, to, dates };
  }
  function cmdQuerySchedule(ctx, i, cmd) {
    const { from, to, dates } = rangeOf(ctx, cmd.range, 6);
    const days = dates.map((date) => { const bl = ctx.work.filter((b) => b.date === date).sort(byWhen).map(blockView);
      return { date, label: fmtDay(date), blocks: bl, studyMin: bl.reduce((s, b) => s + b.studyMin, 0) }; });
    const total = days.reduce((s, d) => s + d.studyMin, 0);
    note(ctx, 'schedule', `${days.reduce((s, d) => s + d.blocks.length, 0)} bloco(s) entre ${fmtDay(from)} e ${fmtDay(to)}, ${C.fmtDur(total * C.MIN)} de estudo.`, { from, to, days, totalStudyMin: total });
  }
  function cmdQueryFree(ctx, i, cmd) {
    const { from, to, dates } = rangeOf(ctx, cmd.range || { date: cmd.date, from: cmd.from, to: cmd.to }, 0);
    const minMin = Number.isInteger(cmd.minMin) ? cmd.minMin : 0, today = C.isoDate(new Date(ctx.nowMs));
    const nowD = new Date(ctx.nowMs), nowMin = nowD.getHours() * 60 + nowD.getMinutes();
    const days = dates.filter((d) => d >= today).map((date) => ({ date, label: fmtDay(date),
      intervals: Cap.freeIntervals(vstate(ctx), date).map((iv) => ({ s: date === today ? Math.max(iv.startMin, nowMin) : iv.startMin, e: iv.endMin }))
        .filter((iv) => iv.e - iv.s >= Math.max(1, minMin)).map((iv) => ({ from: C.fromMin(iv.s), to: C.fromMin(iv.e), min: iv.e - iv.s })) }));
    const total = days.reduce((s, d) => s + d.intervals.reduce((t, iv) => t + iv.min, 0), 0);
    note(ctx, 'free_time', `${C.fmtDur(total * C.MIN)} livres entre ${fmtDay(from)} e ${fmtDay(to)}${minMin ? ` (faixas de ${C.fmtDur(minMin * C.MIN)} ou mais)` : ''}.`, { from, to, minMin, days, totalMin: total });
  }
  function cmdQueryCapacity(ctx, i, cmd) {
    const date = isDate(cmd.week) ? cmd.week : C.isoDate(new Date(ctx.nowMs)), week = Cap.weekKey(date);
    const cap = Cap.capacityFor(vstate(ctx), week, ctx.nowMs);
    const lim = cap.limitMin == null ? 'sem limite' : `limite ${C.fmtDur(cap.limitMin * C.MIN)}`;
    note(ctx, 'capacity', `Semana de ${fmtDay(week)}: ${lim}, planejado ${C.fmtDur(cap.plannedNetMin * C.MIN)}${cap.balanceMin == null ? '' : `, saldo ${C.fmtDur(Math.abs(cap.balanceMin) * C.MIN)}${cap.balanceMin < 0 ? ' (excesso)' : ''}`}.`, { week, capacity: cap });
  }

  function cmdPropose(ctx, i, cmd) {
    const S = getScheduler();
    if (!S || !S.proposeSchedule) { warn(ctx, 'SCHEDULER_INDISPONIVEL', 'O gerador de cronograma ainda não está disponível.'); return; }
    const req = cmd.request || {}, week = Cap.weekKey(isDate(req.week) ? req.week : C.isoDate(new Date(ctx.nowMs)));
    const r = S.proposeSchedule(vstate(ctx), { preserveExisting: true, ...req }, week, ctx.nowMs);
    for (const p of r.placements || []) {
      const blk = Cap.normalizeBlock({ id: genId(ctx), subject: p.subject, title: p.title, date: p.date, start: p.start, estimated: p.estimated,
        config: p.config, kind: p.kind || 'estudo', priority: p.priority || null, deadline: p.deadline || null, material: p.material || '', pdf: p.material || '',
        completed: false, sessions: [], source: 'chat', originWeek: Cap.weekKey(p.date) });
      commit(ctx, { op: 'create', id: blk.id, before: null, after: blk, summary: `Criar: ${describe(blk)}, ${blk.estimated} pomodoro(s)${p.reason ? ` — ${p.reason}` : ''}` });
      ctx.mutating++;
    }
    for (const u of r.unplaced || []) warn(ctx, `NAO_COUBE_${u.code || 'X'}`, `Não coube: ${(u.item && (u.item.title || u.item.subject)) || 'item'} — ${u.reason}`);
    for (const w of r.warnings || []) warn(ctx, typeof w === 'string' ? w : w.code || 'AVISO', typeof w === 'string' ? w : w.text || w.code);
    note(ctx, 'schedule_proposal', `${(r.placements || []).length} bloco(s) encaixado(s), ${(r.unplaced || []).length} não couberam.`, { unplaced: r.unplaced || [], capacity: r.capacity || null });
    ctx.confirm = true; // cronograma gerado sempre passa por revisão
  }

  /** 'YYYY-MM-DD', 'YYYY-MM-DD HH:MM' ou {date, start|time} => {date, min}. */
  function parsePoint(v, defMin) {
    if (!v) return null;
    let date, time;
    if (typeof v === 'string') [date, time] = v.trim().split(/[ T]/);
    else { date = v.date; time = v.start || v.time; }
    if (!isDate(date)) return null;
    const t = time ? normTime(time) : null;
    return { date, min: t ? C.toMin(t) : defMin };
  }
  function cmdReorganize(ctx, i, cmd) {
    const from = parsePoint(cmd.from, 0), to = parsePoint(cmd.to, 1440);
    if (!from || !to) { ask(ctx, { id: `period_${i}`, text: 'Qual período você perdeu? Informe o dia e as horas (de/até).' }); return; }
    const a = C.atMinutes(from.date, from.min).getTime(), z = C.atMinutes(to.date, to.min).getTime();
    const hit = ctx.work.filter((b) => { if (b.completed || b.fixed) return false; const [s, e] = spanOf(b);
      return C.atMinutes(b.date, s).getTime() < z && C.atMinutes(b.date, e).getTime() > a; });
    const rank = { alta: 0, media: 1, baixa: 2 };
    hit.sort((x, y) => (rank[x.priority] ?? 3) - (rank[y.priority] ?? 3) || (x.deadline || '9') .localeCompare(y.deadline || '9') || byWhen(x, y));
    const skippedFixed = ctx.work.filter((b) => b.fixed && !b.completed && (() => { const [s, e] = spanOf(b); return C.atMinutes(b.date, s).getTime() < z && C.atMinutes(b.date, e).getTime() > a; })());
    const moved = [], unplaced = [];
    // libera todos os afetados antes de procurar horários, para um não bloquear o outro
    const after = Math.max(z, ctx.nowMs), afterDate = C.isoDate(new Date(after));
    for (const b of hit) {
      const draft = Cap.normalizeBlock({ ...b });
      const slot = slotsFor(ctx, draft, { prefDate: afterDate, prefStart: C.fromMin(new Date(after).getHours() * 60 + new Date(after).getMinutes()),
        days: 14, max: 1, ignoreId: b.id, afterMs: after, untilDate: b.deadline || null })[0];
      if (!slot) { unplaced.push(b); continue; }
      commit(ctx, { op: 'update', id: b.id, before: clone(b), after: { ...b, date: slot.date, start: slot.start },
        summary: `Reagendar: ${describe(b)} → ${fmtWhen(slot.date, slot.start)}` });
      moved.push({ id: b.id, from: fmtWhen(b.date, b.start), to: fmtWhen(slot.date, slot.start) });
    }
    ctx.mutating += moved.length;
    for (const b of unplaced) warn(ctx, 'NAO_COUBE', `"${b.title}" não coube em nenhum horário livre${b.deadline ? ` antes do prazo (${b.deadline})` : ' nos próximos 14 dias'}; continua no lugar original.`);
    for (const b of skippedFixed) warn(ctx, 'BLOCO_FIXO_NO_PERIODO', `"${b.title}" tem horário obrigatório e não foi movido.`);
    if (unplaced.length && hit.some((b) => !b.priority)) {
      ask(ctx, { id: `reorg_priority_${i}`, text: 'Não há horários para todos os blocos afetados e faltam prioridades. Qual deles deve ser reagendado primeiro?',
        options: hit.map((b) => ({ label: describe(b), commands: [{ type: 'update_block', ref: { id: b.id }, changes: { priority: 'alta' } }, cmd] })) });
    }
    note(ctx, 'reorganize', `${moved.length} bloco(s) reagendado(s), ${unplaced.length} sem horário, ${hit.length ? '' : 'nenhum bloco no período'}`.trim(),
      { moved, unplaced: unplaced.map((b) => b.id), preserved: skippedFixed.map((b) => b.id) });
    ctx.confirm = true;
  }

  function cmdSetLimit(ctx, i, cmd) {
    const v = cmd.limitMin;
    if (!(v === null || (Number.isInteger(v) && v >= 0))) { ask(ctx, { id: `limit_${i}`, text: 'Qual limite semanal devo usar (em horas de estudo líquido)?' }); return; }
    const week = isDate(cmd.week) ? Cap.weekKey(cmd.week) : null, st = ctx.state;
    const before = week ? ((st.weekOverrides || {})[week] || {}).limitMin : (st.settings || {}).weeklyLimitMin;
    const label = v === null ? 'sem limite' : C.fmtDur(v * C.MIN);
    ctx.changes.push({ op: 'setting', id: `limit:${week || 'padrao'}`, target: week ? { scope: 'week', week } : { scope: 'default' },
      before: before === undefined ? null : before, after: v, summary: week ? `Limite da semana de ${fmtDay(week)}: ${label}` : `Limite semanal padrão: ${label}` });
    ctx.confirm = true; ctx.mutating++;
  }

  function cmdUndo(ctx) {
    const last = lastUndoable(ctx.state);
    ctx.undoRequested = true;
    if (!last) warn(ctx, 'NADA_PARA_DESFAZER', 'Não há alteração do chat para desfazer.');
    else note(ctx, 'undo', `Desfazer: ${last.summary}`, { changeSetId: last.id });
  }

  /* ---------- plan ---------- */
  function plan(state, commands, nowMs) {
    nowMs = nowMsOf(nowMs);
    const ctx = makeCtx(state, nowMs), before = {};
    const weeksOf = (blocks) => new Set(blocks.map((b) => Cap.weekKey(b.date)));
    (Array.isArray(commands) ? commands : []).forEach((cmd, i) => {
      if (!cmd || typeof cmd !== 'object') return;
      switch (cmd.type) {
        case 'create_block': return cmdCreate(ctx, i, cmd);
        case 'update_block': return cmdUpdate(ctx, i, cmd);
        case 'move_block': return cmdMove(ctx, i, cmd);
        case 'delete_block': return cmdDelete(ctx, i, cmd);
        case 'add_pomodoro': return cmdAddPomodoro(ctx, i, cmd);
        case 'complete_block': return cmdComplete(ctx, i, cmd, true);
        case 'reopen_block': return cmdComplete(ctx, i, cmd, false);
        case 'add_review': return cmdAddReview(ctx, i, cmd);
        case 'query_schedule': return cmdQuerySchedule(ctx, i, cmd);
        case 'query_free_time': return cmdQueryFree(ctx, i, cmd);
        case 'query_capacity': return cmdQueryCapacity(ctx, i, cmd);
        case 'propose_schedule': return cmdPropose(ctx, i, cmd);
        case 'reorganize': return cmdReorganize(ctx, i, cmd);
        case 'set_limit': return cmdSetLimit(ctx, i, cmd);
        case 'undo_last': return cmdUndo(ctx);
        default: warn(ctx, 'COMANDO_DESCONHECIDO', `Comando não reconhecido: ${cmd.type}`);
      }
    });

    // efeito na capacidade das semanas tocadas (antes x depois), calculado pelos módulos
    const touched = new Set();
    for (const c of ctx.changes) if (c.op !== 'setting') [c.before, c.after].filter(Boolean).forEach((b) => touched.add(Cap.weekKey(b.date)));
    const capB = {}, capA = {};
    const stAfter = applyLimits(vstate(ctx), ctx.changes);
    for (const w of touched) {
      capB[w] = Cap.capacityFor(state, w, nowMs); capA[w] = Cap.capacityFor(stAfter, w, nowMs);
      if (capA[w].excessMin > capB[w].excessMin && !ctx.warnings.some((x) => x.code === 'LIMITE_EXCEDIDO')) {
        warn(ctx, 'LIMITE_EXCEDIDO', `A semana de ${fmtDay(w)} ficaria ${C.fmtDur(capA[w].excessMin * C.MIN)} acima do limite.`);
        ctx.confirm = true;
      }
      for (const code of capA[w].warnings) if (!capB[w].warnings.includes(code) && code !== 'LIMIT_REACHED' && code !== 'EXCESS') warn(ctx, code, `Semana de ${fmtDay(w)}: ${code}.`);
    }

    let status;
    if (ctx.questions.length) status = 'needs_clarification';
    else if (!ctx.changes.length) status = 'ready';
    else status = ctx.confirm || ctx.mutating > 1 || ctx.changes.length > 1 ? 'needs_confirmation' : 'ready';
    return { status, questions: ctx.questions, changes: status === 'needs_clarification' ? [] : ctx.changes, results: ctx.results,
      conflicts: ctx.conflicts, capacityEffect: { weeks: [...touched], before: capB, after: capA }, warnings: ctx.warnings,

        if (i >= 0) { failed.push({ op, reason: 'Já existe um bloco com este identificador.' }); continue; }

});

/* Relatório semanal com diagnóstico (E11 / requisito 11). Módulo puro: lê o estado e devolve o relatório;
 * NUNCA altera o calendário (as sugestões são só propostas, com comandos que o usuário pode confirmar depois).
 * Regras de análise do requisito:
 *  - sem questões registradas ≠ 0% (taxa fica null e a matéria vai para `lowData`);
 *  - mais tempo estudado ≠ dificuldade (dificuldade vem só do resultado nas questões);
 *  - tempo cumprido ≠ concluído ≠ aprendido (contados separadamente);
 *  - taxa = Σ acertos ÷ Σ questões COM resultado preenchido (nunca a média das taxas);
 *  - poucos dados são sinalizados (LOW_DATA_QUESTIONS) em vez de classificar força/fraqueza;
 *  - a semana ORIGINAL (originWeek) é preservada: reagendar não esconde o que não foi feito. */
(function (root, factory) {

  /** Abaixo disto (questões com resultado numa matéria) não se classifica força nem fraqueza. */

    const s = Cap.normalizeState(state);
    const now = new Date(nowMs);
    const dates = Cap.weekDates(weekMonday), weekEnd = dates[6];
    const inWeek = (d) => dates.includes(d);
    const startedIn = (sess) => Cap.weekKey(Core.isoDate(new Date(sess.startedAt))) === weekMonday;

    const origin = s.blocks.filter((b) => b.originWeek === weekMonday);
    const scheduled = s.blocks.filter((b) => inWeek(b.date));

    const rescheduledIn = scheduled.filter((b) => b.originWeek !== weekMonday)

      onTrack: notDone.filter((b) => inWeek(b.date) && Core.blockStatus(b, now) === 'em_dia').length,

          text: `${subject}: apenas ${a.withResult} questão(ões) com resultado (mínimo ${LOW_DATA_QUESTIONS}); ${pct(rate)} ainda não sustenta uma conclusão.` });
      } else {

      .map((b) => ({ blockId: b.id, subject: b.subject, title: b.title, text: String(b.notes).trim() }));

      cands.push({
        type: 'revisao', blockId: b.id, netMin: focus, agendaMin: Core.planBlock(1, s.settings.config).totalMin,
        text: `Revisar "${b.title}" (${b.subject}) com 1 pomodoro.`,
        reason: rate !== null && rate < WEAK_RATE ? `Acerto de ${pct(rate)} neste bloco.` : 'Bloco concluído ainda sem revisão programada.',
        commands: [{ type: 'add_review', ref: { id: b.id } }],

  function shouldGenerate(state, nowMs) {

      try { handlePlan(K.plan(api.getState(), commands, nowMs()), commands); }
      catch (e) { const m = 'Não consegui montar a proposta para esse pedido. Nada foi alterado.'; log('system', m); bubble('system', m); }

        if (data.reply) { log('assistant', data.reply); bubble('assistant', data.reply); }

      } finally { setBusy(false); }
    }

    return { refresh: refreshUndo, send: sendText };
  }

  return { mount, buildContext, reportText };
});

        if (nm >= hStart * 60) html += `<div class="now-line" style="top:${((nm - hStart * 60) / 60) * HPX}px"></div>`;
      }
      html += '</div>';
    });
    $('#calendar').innerHTML = html + '</div>';
  }

  function blockHtml(b, hStart, now, conflict) {
    const sp = C.blockSpan(b), st = C.blockStatus(b, now);
    const active = state.session && state.session.blockId === b.id;
    const height = Math.max(30, (sp.totalMin / 60) * HPX - 2);
    const tip = [`${b.subject} — ${b.title}`, `${b.start}–${C.fromMin(sp.endMin)}`,
      `Estudo ${dur(sp.studyMin * C.MIN)} + descanso ${dur(sp.restMin * C.MIN)}`, `Situação: ${C.STATUS_LABEL[st]}`, ...(conflict || [])].join('\n');
    return `<div class="block st-${st}${conflict ? ' conflict' : ''}${active ? ' active' : ''}" draggable="true" data-id="${b.id}" title="${esc(tip)}"
      style="top:${((sp.startMin - hStart * 60) / 60) * HPX}px;height:${height}px">
      <b>${esc(b.subject)} · ${esc(b.title)}</b>
      <span class="meta">${b.start}–${C.fromMin(sp.endMin)} · 🍅 ${b.estimated}</span>
      <span class="tag">${C.STATUS_LABEL[st]}</span>${active ? ' <span class="tag run">● Em andamento</span>' : ''}${conflict ? ' <span class="tag warn">⚠ Conflito</span>' : ''}
    </div>`;
  }

  function bindCalendar() {
    const cal = $('#calendar');
    cal.addEventListener('click', (e) => {
      const blk = e.target.closest('.block');
      if (blk) return openBlockDialog({ id: blk.dataset.id });
      const col = e.target.closest('.col');
      if (!col) return;
      const y = e.clientY - col.getBoundingClientRect().top;
      const min = Number(col.dataset.hstart) * 60 + Math.floor((y / HPX) * 4) * 15;
      openBlockDialog({ date: col.dataset.date, start: C.fromMin(Math.min(min, 1425)) });
    });
    cal.addEventListener('dragstart', (e) => {
      const blk = e.target.closest('.block');
      if (!blk) return;
      ui.drag = { id: blk.dataset.id, grab: e.clientY - blk.getBoundingClientRect().top };
      e.dataTransfer.setData('text/plain', blk.dataset.id); e.dataTransfer.effectAllowed = 'move';
    });
    cal.addEventListener('dragover', (e) => {
      const col = e.target.closest('.col');
      if (col && ui.drag) { e.preventDefault(); col.classList.add('dragover'); }
    });
    cal.addEventListener('dragleave', (e) => { const col = e.target.closest('.col'); if (col) col.classList.remove('dragover'); });
    cal.addEventListener('dragend', () => { ui.drag = null; renderCalendar(); });
    cal.addEventListener('drop', (e) => {
      const col = e.target.closest('.col');
      if (!col || !ui.drag) return;
      e.preventDefault();
      const b = blockById(ui.drag.id), total = C.blockSpan(b).totalMin;
      const y = e.clientY - col.getBoundingClientRect().top - ui.drag.grab;
      let min = Math.round((Number(col.dataset.hstart) * 60 + (y / HPX) * 60) / 15) * 15;
      min = Math.max(0, Math.min(min, 1440 - total));
      b.date = col.dataset.date; b.start = C.fromMin(min);
      ui.drag = null; save(); renderCalendar();
    });
  }

  /* ---------- diálogo do bloco (cadastro, detalhes e execução) ---------- */
  const numVal = (v) => (v === '' ? NaN : Number(v));
  function sessionsHtml(b) {
    if (!b.sessions.length) return '<p class="muted">Nenhuma sessão registrada ainda.</p>';
    return '<ul>' + b.sessions.map((s) => {
      const t = s.totals, d = new Date(s.startedAt);
      return `<li>${d.toLocaleDateString('pt-BR')} ${d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}: foco ${dur(t.focusMs)} + extra ${dur(t.extraMs)} = <b>${dur(t.studyMs)}</b>
        · descanso ${dur(t.restMs)} · interrupções ${dur(t.interruptMs)} · ${s.completedPomodoros} pomodoro(s)${s.partialCycles ? ` + ${s.partialCycles} parcial` : ''}</li>`;
    }).join('') + '</ul>';
  }

      kind: 'estudo', reviewOf: null, priority: null, deadline: null, fixed: false, remainingMin: null, ...(prefill || {}) };
    const cfg = v.config;

    const active = b && state.session && state.session.blockId === b.id;

      </div>
      <datalist id="subjects">${subjects.map((s) => `<option value="${esc(s)}">`).join('')}</datalist>
      <details style="margin-top:8px"><summary>Pomodoro deste bloco (copiado do padrão; ajuste se precisar)</summary><div class="form-grid" style="margin-top:8px">
        <label>Foco (min)<input type="number" name="focusMin" min="1" step="1" value="${cfg.focusMin}"></label>
        <label>Pausa curta (min)<input type="number" name="shortMin" min="1" step="1" value="${cfg.shortMin}"></label>
        <label>Pomodoros até a pausa longa<input type="number" name="longEvery" min="1" step="1" value="${cfg.longEvery}"></label>
        <label>Pausa longa (min)<input type="number" name="longMin" min="1" step="1" value="${cfg.longMin}"></label>
        <div class="wide"><button type="button" id="use-default">Usar configuração padrão atual</button></div>
      </div></details>
      <div class="preview" id="plan-preview"></div><div class="preview" id="cap-preview"></div></fieldset>
      ${b ? `<fieldset><legend>Execução</legend><div class="form-grid">
        <label class="wide">Conteúdo / páginas efetivamente estudados<input name="studied" value="${esc(v.studied)}"></label>
        <label>Questões respondidas<input name="questions" inputmode="numeric" value="${v.questions ?? ''}"></label>
        <label>Acertos<input name="hits" inputmode="numeric" value="${v.hits ?? ''}"></label>
        <div class="field">Erros / Taxa de acerto<b id="res-calc"></b></div>
        <label class="wide">Observações (dificuldades, conteúdo pendente)<textarea name="notes" rows="3">${esc(v.notes)}</textarea></label></div>
        <div class="preview"><b>Realizado:</b> foco regular ${dur(real.focusMs)} + extra ${dur(real.extraMs)} = <b>${dur(real.studyMs)}</b> estudados
          · descanso ${dur(real.restMs)} · interrupções ${dur(real.interruptMs)}<br>
          Pomodoros completos: ${pom.complete} de ${v.estimated} estimados · ciclos parciais: ${pom.partial}</div>
        <details style="margin-top:8px"><summary>Sessões (${v.sessions.length})</summary>${sessionsHtml(b)}</details></fieldset>` : ''}
      <div class="errors" id="block-errors"></div>
      <div class="actions">
        <div class="left">${b ? `<button type="button" id="b-timer" class="primary">${active ? '⏱ Abrir cronômetro' : (b.sessions.length ? '⏱ Retomar estudo (nova sessão)' : '⏱ Iniciar cronômetro')}</button>
          ${b.kind !== 'revisao' ? '<button type="button" id="b-review">＋ Agendar revisão</button>' : ''}

        <button type="button" id="b-cancel">Fechar</button><button type="submit" class="primary">Salvar</button>
      </div></form>`;
    const form = $('#block-form', dlg);
    const read = (n) => (form.elements[n] ? form.elements[n].value : '');

    const gatherPlan = () => ({
      subject: read('subject').trim(), title: read('title').trim(), date: read('date'), start: read('start'),
      estimated: numVal(read('estimated')), pdf: read('pdf').trim(), pages: read('pages').trim(),
      config: { focusMin: numVal(read('focusMin')), shortMin: numVal(read('shortMin')), longEvery: numVal(read('longEvery')), longMin: numVal(read('longMin')) },
      kind: read('kind') || 'estudo', priority: read('priority') || null, deadline: read('deadline') || null,
      fixed: !!(form.elements.fixed && form.elements.fixed.checked),
    });
    // Efeito do bloco sobre a capacidade da semana de destino (sem salvar nada).
    const capInfo = (data) => {
      if (C.validateBlockPlan(data).length) return null;
      const wk = K.weekKey(data.date), now = Date.now();
      const draft = b ? { ...b, ...data } : K.normalizeBlock({ id: '__novo', completed: false, sessions: [], ...data });
      const after = K.capacityFor({ ...state, blocks: b ? state.blocks.map((x) => (x.id === b.id ? draft : x)) : [...state.blocks, draft] }, wk, now);
      return { wk, after, before: K.capacityFor(state, wk, now) };
    };
    const guardCapacity = (data) => {
      const info = capInfo(data);
      if (!info || info.after.excessMin <= info.before.excessMin) return true;
      const opts = b ? [] : K.wouldFit(state, data, info.wk).options.map((o) => '• ' + o.text);
      if (!opts.length) opts.push('• Reduzir os pomodoros deste bloco.', '• Transferir este ou outro bloco para outra semana.', '• Excluir ou substituir um bloco menos prioritário.');
      return confirm(`Esta mudança faz a carga da semana ultrapassar o limite em ${dur(info.after.excessMin * C.MIN)}.\n\nAlternativas:\n${opts.join('\n')}\n\nDeseja ultrapassar o limite mesmo assim? (O limite NÃO será alterado.)`);
    };
    const refresh = () => {
      const p = gatherPlan(), errs = C.validateBlockPlan(p);
      const okCfg = !C.validateConfig(p.config).length && Number.isInteger(p.estimated) && p.estimated >= 1;
      if (okCfg) {
        const sp = C.planBlock(p.estimated, p.config), end = C.fromMin(C.toMin(p.start || '00:00') + sp.totalMin);
        $('#plan-preview', dlg).innerHTML = `Tempo previsto de estudo: <b>${dur(sp.studyMin * C.MIN)}</b> · descanso: <b>${dur(sp.restMin * C.MIN)}</b> ·
          duração reservada: <b>${dur(sp.totalMin * C.MIN)}</b> · término previsto: <b>${end}</b>`;
      } else $('#plan-preview', dlg).textContent = 'Preencha estimativa e pomodoro com inteiros positivos para ver os cálculos.';
      const ci = capInfo(p);
      if (ci) {
        const a = ci.after, lim = a.limitMin;
        $('#cap-preview', dlg).innerHTML = lim === null ? 'Semana sem limite definido.' :
          `Semana de ${C.parseDate(ci.wk).toLocaleDateString('pt-BR', { day: 'numeric', month: 'short' })}: carga <b>${dur(a.plannedNetMin * C.MIN)}</b> de <b>${dur(lim * C.MIN)}</b> → ` +
          (a.excessMin > 0 ? `<b style="color:var(--red)">excesso de ${dur(a.excessMin * C.MIN)}</b>` : `saldo <b>${dur(a.balanceMin * C.MIN)}</b>`) +
          (K.freeIntervals(state, p.date, b ? [b.id] : []).some((iv) => iv.startMin <= C.toMin(p.start) && iv.endMin >= C.toMin(p.start) + K.agendaMin({ ...p })) ? '' : '<br>⚠ Este horário está fora da disponibilidade ou ocupado.');
      } else $('#cap-preview', dlg).textContent = '';
      if (b) {
        const r = C.validateResult(read('questions'), read('hits'));
        const a = C.accuracy({ questions: r.questions, hits: r.hits });
        $('#res-calc', dlg).textContent = r.errors.length ? '—' : (a.kind === 'value' ? `${a.errors} erro(s) · ${a.label}` : a.label);
      }
      return errs;
    };
    // Valida e devolve os dados; null se houver erros (exibidos no diálogo).
    const collect = () => {
      const errs = refresh(), data = gatherPlan();
      if (b) {
        const r = C.validateResult(read('questions'), read('hits'));
        errs.push(...r.errors);
        Object.assign(data, { studied: read('studied').trim(), notes: read('notes').trim(), questions: r.questions, hits: r.hits });
        const rm = parseCountLocal(read('remaining'));
        if (rm.error) errs.push('Restante previsto: use apenas números inteiros não negativos.'); else data.remainingMin = rm.value;
      }
      $('#block-errors', dlg).innerHTML = errs.map((m) => `<div>${esc(m)}</div>`).join('');
      return errs.length ? null : data;
    };
    const commit = (data) => {
      if (b) Object.assign(b, data);
      else state.blocks.push(K.normalizeBlock({ id: uid(), completed: false, sessions: [], studied: '', questions: null, hits: null, notes: '', reviewOf: v.reviewOf || null, ...data }));
      save();
    };
    form.addEventListener('input', refresh);
    $('#use-default', dlg).onclick = () => { Object.entries(state.settings.config).forEach(([k, val]) => { form.elements[k].value = val; }); refresh(); };
    $('#b-cancel', dlg).onclick = () => dlg.close();
    form.addEventListener('submit', (e) => { e.preventDefault(); const d = collect(); if (!d || !guardCapacity(d)) return; commit(d); dlg.close(); render(); });
    if (b) {
      $('#b-delete', dlg).onclick = () => {
        if (!confirm('Excluir este bloco e todo o seu histórico de sessões?')) return;
        if (active) state.session = null;
        state.blocks = state.blocks.filter((x) => x.id !== b.id); save(); dlg.close(); render();
      };
      $('#b-toggle', dlg).onclick = () => {
        const d = collect(); if (!d) return;
        Object.assign(d, { completed: !b.completed, completedAt: b.completed ? null : Date.now() });
        commit(d); dlg.close(); render();
      };
      const rv = $('#b-review', dlg);
      if (rv) rv.onclick = () => {
        const d = collect(); if (!d) return;
        commit(d); dlg.close();
        const next = C.isoDate(C.addDays(C.parseDate(d.date), 7));
        openBlockDialog({ date: next, start: d.start, prefill: { kind: 'revisao', reviewOf: b.id, subject: d.subject, title: `Revisão: ${d.title}`, estimated: 1, pdf: d.pdf, priority: d.priority } });
      };
      $('#b-timer', dlg).onclick = () => {
        const d = collect(); if (!d || !guardCapacity(d)) return;
        commit(d); startTimer(b.id) && dlg.close(); render();
      };
    }
    refresh();
    dlg.showModal();
  }

  /* ---------- cronômetro ---------- */
  function startTimer(blockId) {
    unlockAudio();
    if ('Notification' in window && Notification.permission === 'default') { try { Notification.requestPermission(); } catch (e) { /* ignora */ } }
    if (state.session) {
      if (state.session.blockId === blockId) { $('#timer').scrollIntoView({ block: 'end' }); return true; }
      const other = blockById(state.session.blockId);
      alert(`Já existe um cronômetro ativo no bloco "${other ? other.title : '?'}". Encerre-o antes de iniciar outro.`);
      return false;
    }
    const b = blockById(blockId);
    state.session = C.startSession(blockId, b.config, Date.now());
    save(); return true;
  }
  function timerAction(act) {
    const s = state.session; if (!s) return;
    const now = Date.now();
    unlockAudio();
    if (act === 'pause') C.pause(s, now);
    else if (act === 'resume') C.resume(s, now);
    else if (act === 'break') C.startBreak(s, now);
    else if (act === 'focus') C.startFocus(s, now);
    else if (act === 'open') return openBlockDialog({ id: s.blockId });
    else if (act === 'finish') {
      C.advance(s, now);
      const lt = C.liveTotals(s, now);
      if (!confirm(`Encerrar a sessão e salvar ${dur(lt.studyMs)} de estudo (${dur(lt.extraMs)} de tempo extra)?`)) return;
      const rec = C.finishSession(s, now), b = blockById(s.blockId);
      if (b && (rec.totals.studyMs > 0 || rec.totals.restMs > 0)) b.sessions.push(rec);
      state.session = null; $('#alert-banner').hidden = true; document.title = 'Estudy – Organização dos Estudos';
    }
    save(); handleAlert(); render();
  }
  function renderTimer() {
    const el = $('#timer'), s = state.session;
    if (!s) { el.hidden = true; ui.timerSig = ''; return; }
    const b = blockById(s.blockId);
    if (!b) { state.session = null; save(); el.hidden = true; return; }
    const now = Date.now(), sig = [s.id, s.phase, s.state].join('|');
    if (sig !== ui.timerSig) {
      ui.timerSig = sig;
      const brk = C.isBreak(s.phase), focusLike = !brk;
      const kind = C.nextBreakKind(s) === 'long' ? 'longa' : 'curta';
      const btn = (a, label, cls = '') => `<button data-act="${a}" class="${cls}">${label}</button>`;
      let buttons = '';
      if (s.state === 'awaiting') buttons = btn('focus', '▶ Iniciar foco', 'primary');
      else if (s.state === 'paused') buttons = btn('resume', '▶ Retomar', 'primary') + (focusLike ? btn('break', `☕ Pausa ${kind}`) : btn('focus', 'Iniciar foco'));
      else buttons = btn('pause', '⏸ Pausar') + (focusLike ? btn('break', `☕ Iniciar pausa ${kind}`) : btn('focus', 'Pular pausa e iniciar foco'));
      buttons += btn('finish', '⏹ Encerrar', 'danger') + btn('open', 'Bloco');
      el.className = `timer ${s.phase === 'extra' ? 'extra' : brk ? 'rest' : ''}`;
      el.innerHTML = `<div class="muted" id="t-block"></div><div class="phase" id="t-phase"></div><div class="clock" id="t-clock"></div>
        <div class="row">${buttons}</div><div class="info" id="t-info"></div>`;
      $('#t-block', el).textContent = `${b.subject} — ${b.title}`;
    }
    const el0 = C.elapsed(s, now), PH = { focus: 'Foco', extra: 'Tempo extra', short: 'Pausa curta', long: 'Pausa longa' };
    let label = PH[s.phase], clock;
    if (s.state === 'awaiting') { label = 'Pausa encerrada — aguardando você'; clock = '00:00'; }
    else if (s.phase === 'extra') clock = '+' + C.fmtClock(el0);
    else clock = C.fmtClock(C.phaseDuration(s) - el0);
    if (s.state === 'paused') label += ' (pausado)';
    const prev = C.sessionsPomodoros(b.sessions), lt = C.liveTotals(s, now), tot = C.blockRealized(b, s, now);
    $('#t-phase', el).textContent = label;
    $('#t-clock', el).textContent = clock;
    $('#t-info', el).innerHTML = `<span>🍅 Concluídos: <b>${prev.complete + s.completed}</b> de <b>${b.estimated}</b> estimados</span>
      <span>Estudo total no bloco: <b>${dur(tot.studyMs)}</b> (extra ${dur(tot.extraMs)})</span>
      <span>Nesta sessão: foco ${dur(lt.focusMs)} · extra ${dur(lt.extraMs)} · descanso ${dur(lt.restMs)} · interrupções ${dur(lt.interruptMs)}</span>`;
    el.hidden = false;
    document.title = `${clock} · ${label} – Estudy`;
  }

  /* ---------- exceção de uma semana (não altera a rotina padrão) ---------- */
  function openWeekDialog() {
    const dlg = $('#dlg-week'), monday = C.isoDate(ui.weekStart), eff = K.effectiveWeek(state, monday), base = state.settings.availability;
    const ov = state.weekOverrides[monday] || {};
    const title = `${ui.weekStart.toLocaleDateString('pt-BR', { day: 'numeric', month: 'short' })} – ${C.addDays(ui.weekStart, 6).toLocaleDateString('pt-BR', { day: 'numeric', month: 'short' })}`;
    dlg.innerHTML = `<form method="dialog" id="week-form" novalidate><h3>Semana ${title}</h3>

    const f = $('#week-form', dlg);
    $('#week-cancel', dlg).onclick = () => dlg.close();
    $('#week-reset', dlg).onclick = () => { delete state.weekOverrides[monday]; save(); dlg.close(); render(); };
    f.addEventListener('submit', (e) => {
      e.preventDefault();
      const errs = [], o = {};
      const lim = hoursToMin(f.elements.limitH.value);
      if (lim.error) errs.push('Limite: informe horas (ex.: 20 ou 22,5) ou deixe vazio.'); else if (lim.value !== null) o.limitMin = lim.value;
      const days = {};
      for (let d = 1; d <= 7; d++) {
        const r = parseRanges(f.elements['day' + d].value, WD[d]);
        if (r.error) { errs.push(r.error); continue; }
        if (fmtRanges(r.ranges) !== fmtRanges(base.days[d])) days[d] = r.ranges; // só guarda o que difere do padrão
      }
      if (Object.keys(days).length) o.days = days;
      const un = parseUnavail(f.elements.unavail.value); if (un.error) errs.push(un.error); else if (un.list.length) o.unavailable = un.list;

  function loadDemo() {

  /* ---------- relatórios ---------- */
  const rate = (g) => (g.rate !== null ? g.rate.toFixed(1).replace('.', ',') + '%' : (g.pendingResults ? 'Resultado pendente' : 'Sem questões registradas'));
  function renderReports() {
    const sel = $('#f-subject'), cur = sel.value;
    sel.innerHTML = '<option value="">Todas</option>' + [...new Set(state.blocks.map((b) => b.subject))].sort().map((s) => `<option${s === cur ? ' selected' : ''}>${esc(s)}</option>`).join('');
    const opts = { subject: sel.value, from: $('#f-from').value, to: $('#f-to').value, groupBy: $('#f-group').value };
    const now = new Date(), r = C.consolidate(state.blocks, opts, now, state.session);
    if (!r.blocks.length) { $('#report').innerHTML = '<p class="muted">Nenhum bloco encontrado para os filtros escolhidos.</p>'; return; }
    const lbl = opts.groupBy === 'week' ? (k) => `Semana de ${C.parseDate(k).toLocaleDateString('pt-BR')}` : (k) => k;

      <td>${g.pomodoros.complete}/${g.pomodoros.partial}</td><td>${g.questions}</td><td>${g.hits}</td><td>${g.errors}</td><td>${rate(g)}</td>
      <td>${g.status.concluido}</td><td>${g.status.atrasado}</td><td>${g.status.em_dia}</td><td>${g.overrun}</td></tr>`;
    let html = `<div class="table-wrap"><table><thead><tr><th class="l">${opts.groupBy === 'week' ? 'Período' : 'Matéria'}</th><th>Blocos</th><th>Estudo previsto</th><th>Descanso previsto</th>
      <th>Estudado (total)</th><th>Foco regular</th><th>Tempo extra</th><th>Descanso real</th><th>Interrupções</th><th>Pomodoros (compl./parc.)</th>
      <th>Questões</th><th>Acertos</th><th>Erros</th><th>Taxa de acerto</th><th>Concluídos</th><th>Atrasados</th><th>Em dia</th><th>Acima do previsto</th></tr></thead><tbody>
      ${r.rows.map((g) => row(g, lbl(g.key))).join('')}${r.rows.length > 1 ? row(r.total, 'Total geral', 'total') : ''}</tbody></table></div>
      <p class="muted">Taxa de acerto = soma dos acertos ÷ soma das questões dos blocos com resultado preenchido (não é a média das taxas). Questões sem resultado: ${r.total.questions - r.total.questionsWithResult}.</p>`;
    // pontos de atenção
    const ranked = r.rows.filter((g) => g.rate !== null).sort((a, b) => a.rate - b.rate);
    const late = r.blocks.filter((b) => C.blockStatus(b, now) === 'atrasado');
    const notes = r.blocks.filter((b) => !b.completed && b.notes);
    html += '<h3>Pontos de atenção</h3><ul>' +
      (ranked.length > 1 ? `<li>Menor taxa de acerto: <b>${esc(lbl(ranked[0].key))}</b> (${rate(ranked[0])}).</li>` : '') +
      `<li>${r.total.overrun} bloco(s) com mais tempo estudado do que o previsto.</li><li>${late.length} bloco(s) atrasado(s) e não concluído(s).</li>` +
      notes.map((b) => `<li>Pendência em <b>${esc(b.subject)} – ${esc(b.title)}</b>: ${esc(b.notes)}</li>`).join('') + '</ul>';
    // blocos que compõem os resultados
    html += '<h3>Blocos do resultado</h3>' + r.rows.map((g) => `<details class="rep-blocks"><summary>${esc(lbl(g.key))} (${g.blocks.length})</summary><div class="table-wrap"><table>
      <thead><tr><th class="l">Dia</th><th class="l">Bloco</th><th>Situação</th><th>Previsto</th><th>Estudado</th><th>Extra</th><th>Questões</th><th>Acertos</th><th>Taxa</th></tr></thead><tbody>
      ${g.blocks.slice().sort((a, b) => (a.date + a.start < b.date + b.start ? -1 : 1)).map((b) => {
        const sp = C.blockSpan(b), re = C.blockRealized(b, state.session, now.getTime()), a = C.accuracy(b), st = C.blockStatus(b, now);
        return `<tr><td class="l">${C.parseDate(b.date).toLocaleDateString('pt-BR')} ${b.start}</td><td class="l"><a href="#" data-open-block="${b.id}">${esc(b.subject)} – ${esc(b.title)}</a></td>
          <td><span class="chip st-${st}">${C.STATUS_LABEL[st]}</span></td><td>${dur(sp.studyMin * C.MIN)}</td><td>${dur(re.studyMs)}</td><td>${dur(re.extraMs)}</td>
          <td>${b.questions ?? '—'}</td><td>${b.hits ?? '—'}</td><td>${a.label}</td></tr>`;
      }).join('')}</tbody></table></div></details>`).join('');
    $('#report').innerHTML = html;
  }


  /* ---------- relatório semanal (requisito 11): só mostra e PROPÕE; não altera o calendário sozinho ---------- */
  const W = window.WeeklyReport || null;
  const pct = (r) => (r === null || r === undefined ? '—' : r.toFixed(1).replace('.', ',') + '%');
  /** Gera (uma vez) o relatório da semana fechada e avisa na aba e no chat. */
  function autoGenerateReport() {
    if (!W) return;
    const wk = W.shouldGenerate(state, Date.now());
    if (!wk) return;
    const rep = W.buildWeeklyReport(state, wk, Date.now());
    if (!rep.execution.planned && !rep.execution.studiedMin) return; // semana sem atividade: não gera relatório vazio
    state.reports = { ...state.reports, [wk]: rep };
    const msgs = ((state.chat || {}).messages || []).concat([{ role: 'system', at: Date.now(), text: `📊 O relatório da semana de ${C.parseDate(wk).toLocaleDateString('pt-BR')} está pronto: abra a aba "Relatório semanal" para ver o diagnóstico e as sugestões (nada foi alterado no calendário).` }]);
    state.chat = { messages: msgs.slice(-100) };
    save();
    $('#tab-weekly').textContent = 'Relatório semanal ●';
  }
  function applySuggestion(sg) {
    const plan = window.Commands.plan(state, sg.commands, Date.now());
    if (plan.status === 'needs_clarification' || !plan.changes.length) {
      alert('Não consegui aplicar automaticamente:\n' + ((plan.questions || []).map((q) => '• ' + q.text).join('\n') || (plan.warnings || []).map((x) => '• ' + x.text).join('\n') || 'Nenhuma alteração possível.'));
      return;
    }
    if (!confirm(`${sg.text}\n\nMotivo: ${sg.reason}\n\nAlterações que serão feitas:\n${plan.changes.map((c) => '• ' + c.summary).join('\n')}\n\nAplicar no calendário?`)) return;
    const res = window.Commands.applyChanges(state, plan.changes, { source: 'chat', summary: sg.text, nowMs: Date.now() });
    if (res.applied.length) { state = K.normalizeState(res.state); save(); render(); }
    alert(res.applied.length ? `${res.applied.length} alteração(ões) salva(s).${res.failed.length ? '\nNão aplicadas:\n' + res.failed.map((f) => '• ' + f.reason).join('\n') : ''}` : 'Nada foi alterado:\n' + res.failed.map((f) => '• ' + f.reason).join('\n'));
  }
  function renderWeekly() {
    const el = $('#weekly'), sel = $('#w-week');
    if (!W) { el.textContent = 'Módulo de relatório indisponível.'; return; }
    const now = Date.now(), cur = K.weekKey(C.isoDate(new Date(now)));
    const weeks = [...new Set([...state.blocks.map((b) => b.originWeek || K.weekKey(b.date)), ...Object.keys(state.reports), C.isoDate(C.addDays(C.parseDate(cur), -7)), cur])].sort().reverse();
    const keep = sel.value && weeks.includes(sel.value) ? sel.value : (Object.keys(state.reports).sort().pop() || weeks.find((w) => w < cur) || cur);
    sel.innerHTML = weeks.map((w) => `<option value="${w}"${w === keep ? ' selected' : ''}>${C.parseDate(w).toLocaleDateString('pt-BR')} – ${C.addDays(C.parseDate(w), 6).toLocaleDateString('pt-BR')}${w === cur ? ' (atual)' : ''}</option>`).join('');
    const wk = sel.value, r = W.buildWeeklyReport(state, wk, now), ex = r.execution, f = (m) => dur(m * C.MIN);
    const saved = state.reports[wk];
    $('#w-meta').textContent = saved ? `Gerado em ${new Date(saved.generatedAt).toLocaleString('pt-BR')} · esta tela recalcula com os registros atuais` : 'Ainda não gerado automaticamente (a semana pode não ter fechado).';
    const li = (arr, fn) => (arr && arr.length ? `<ul>${arr.map((x) => `<li>${fn(x)}</li>`).join('')}</ul>` : '<p class="muted">Nada a registrar.</p>');
    const nw = r.nextWeek;
    el.innerHTML = `<h3>Execução da semana</h3><div class="summary">${[
      ['Blocos planejados', ex.planned], ['Concluídos', ex.done], ['Atrasados', ex.late], ['Em dia', ex.onTrack], ['Parcialmente realizados', ex.partial],
      ['Tempo planejado', f(ex.plannedMin)], ['Tempo estudado', f(ex.studiedMin)], ['… tempo extra', f(ex.extraMin)],
      ['Questões respondidas', `${ex.questions}${ex.questionsWithResult !== ex.questions ? ` (${ex.questionsWithResult} com resultado)` : ''}`], ['Acertos', ex.hits], ['Erros', ex.errors], ['Taxa de acerto', ex.rate === null ? 'Sem questões com resultado' : pct(ex.rate)],
    ].map(([l, v]) => `<div class="stat"><span class="muted">${l}</span><b>${v}</b></div>`).join('')}</div>
      ${ex.rescheduledOut.length ? `<p><b>Reagendados para outra semana (continuam contando como não realizados aqui):</b></p>${li(ex.rescheduledOut, (x) => esc(x.text || (x.title ? `${x.subject} — ${x.title}` : JSON.stringify(x))))}` : ''}
      ${ex.timeMetNotCompleted ? `<p class="muted">${ex.timeMetNotCompleted} bloco(s) cumpriram o tempo previsto, mas não foram concluídos.</p>` : ''}
      <h3>Forças e fraquezas</h3>
      <p><b>Pontos fortes</b></p>${li(r.strengths, (x) => esc(x.reason || x.text || x.subject))}
      <p><b>Pontos de atenção</b></p>${li(r.weaknesses, (x) => esc(x.reason || x.text || x.subject))}
      ${r.lowData.length ? `<p><b>Poucos dados para concluir</b></p>${li(r.lowData, (x) => esc(x.text))}` : ''}
      ${r.registeredDifficulties.length ? `<p><b>Dificuldades que você registrou</b></p>${li(r.registeredDifficulties, (x) => `<b>${esc(x.subject)} — ${esc(x.title)}:</b> ${esc(x.text)}`)}` : ''}
      ${r.estimationBias.length ? `<p><b>Estimado × realizado</b></p>${li(r.estimationBias, (x) => `${esc(x.subject)}: previsto ${f(x.avgPlannedMin)}, realizado ${f(x.avgRealMin)} (${x.n} bloco(s) concluído(s))${x.recurrentOverrun ? ' — estoura com frequência' : ''}`)}` : ''}
      <details><summary class="muted">Como ler este relatório</summary>${li(r.cautions, esc)}</details>

      <p><b>Sugestões</b> <span class="muted">(são propostas; nada muda no calendário até você aplicar)</span></p>
      ${nw.suggestions.length ? nw.suggestions.map((sg, i) => `<div class="stat" style="margin-bottom:6px"><b>${esc(sg.text)}</b><br><span class="muted">Por quê: ${esc(sg.reason)}</span><br>
        <span class="muted">Impacto: ${sg.impact && sg.impact.netMin !== undefined ? `+${f(sg.impact.netMin)} de estudo` : ''}${sg.impact && sg.impact.balanceAfterMin !== undefined ? `, saldo da semana após aplicar: ${f(sg.impact.balanceAfterMin)}` : ''}</span><br>
        <button type="button" data-sg="${i}">Aplicar esta sugestão…</button></div>`).join('') : '<p class="muted">Sem sugestões.</p>'}
      ${nw.doesNotFit.length ? `<div class="unplaced"><b>Não cabe na semana seguinte:</b><br>${nw.doesNotFit.map((x) => '• ' + esc(x.reason || x.text)).join('<br>')}</div>` : ''}
      ${nw.note ? `<p class="muted">${esc(nw.note)}</p>` : ''}`;

  /* ---------- orquestração ---------- */
  function setView(v) {

  /* ---------- gerar cronograma (requisito 08): propõe, deixa revisar e só grava após confirmar ---------- */

    const rowHtml = () => `<div class="sched-row">
      <label>Matéria *<input data-f="subject" list="subjects-s"></label><label>Assunto/atividade *<input data-f="title"></label>
      <label>Qtd. de blocos *<input data-f="blocks" type="number" min="1" step="1" value="1"></label><label>Pomodoros por bloco *<input data-f="pomodoros" type="number" min="1" step="1" value="2"></label>
