<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estudy – Organização dos Estudos</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/chat.css">
</head>
<body>
  <header class="topbar">
    <h1>📚 Estudy</h1>
    <nav>
      <button data-view="calendar" class="tab active">Calendário</button>
      <button data-view="reports" class="tab">Relatórios</button>
      <button data-view="weekly" class="tab" id="tab-weekly">Relatório semanal</button>
      <button id="btn-chat" class="tab">💬 Assistente</button>
      <button id="btn-settings" class="tab">⚙ Pomodoro padrão</button>
    </nav>
  </header>

  <div id="alert-banner" class="alert-banner" hidden role="alert"></div>

  <main>
    <section id="view-calendar">
      <div class="cal-toolbar">
        <div class="cal-nav">
          <button id="prev-week" aria-label="Semana anterior">‹</button>
          <button id="today-week">Hoje</button>
          <button id="next-week" aria-label="Próxima semana">›</button>
          <h2 id="week-title"></h2>
        </div>
        <div class="cal-nav"><button id="gen-schedule">🗓 Gerar cronograma</button><button id="week-config">⚙ Semana: limite e disponibilidade</button><button id="new-block" class="primary">+ Novo bloco</button></div>
      </div>
      <div id="capacity" class="summary capacity"></div>
      <div id="week-summary" class="summary"></div>
      <div class="legend">
        <span class="chip st-em_dia">Em dia</span><span class="chip st-atrasado">Atrasado</span><span class="chip st-concluido">Concluído</span>
        <span class="muted">Clique em um horário vazio para criar · arraste um bloco para reagendar</span>
      </div>
      <div id="calendar" class="calendar"></div>
    </section>

    <section id="view-weekly" hidden>
      <div class="filters"><label>Semana <select id="w-week"></select></label><button type="button" id="w-refresh">Atualizar relatório</button>
        <span class="muted" id="w-meta"></span></div>
      <div id="weekly"></div>
    </section>

    <section id="view-reports" hidden>
      <form id="report-filters" class="filters">
        <label>Matéria <select id="f-subject"></select></label>
        <label>De <input type="date" id="f-from"></label>
        <label>Até <input type="date" id="f-to"></label>
        <label>Agrupar por
          <select id="f-group"><option value="subject">Matéria</option><option value="week">Semana</option></select>
        </label>
        <button type="button" id="f-clear">Limpar</button>
      </form>
      <div id="report"></div>
    </section>
  </main>

  <aside id="chat-drawer" class="chat-drawer" hidden></aside>
  <aside id="timer" class="timer" hidden></aside>

  <dialog id="dlg-block"></dialog>
  <dialog id="dlg-settings"></dialog>
  <dialog id="dlg-week"></dialog>
  <dialog id="dlg-schedule"></dialog>

  <script src="js/core.js"></script>
  <script src="js/capacity.js"></script>
  <script src="js/scheduler.js"></script>
  <script src="js/commands.js"></script>
  <script src="js/weeklyreport.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
